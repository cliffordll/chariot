[project]
name = "chariot-proxy"
version = "0.6.5"
description = "本地跑的智能体(库 + CLI + Tauri sidecar;可热插拔 Provider:Mock / Anthropic / 后续真实后端)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "lianaipeng" }]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.28",
    "psutil>=6.0",
    "typer>=0.13",
    "python-ulid>=2.0",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "trafilatura>=1.6",
    "duckduckgo-search>=5.0",
]

[project.scripts]
chariot = "chariot.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chariot"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.409",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "types-pyyaml>=6.0",
]
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 真启动子进程 / 访问外部服务的集成测试(--integration 才跑)",
]
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# 项目惯例:dataclass field(default_factory=dict) 大量出现,
# `# type: ignore` 也常见;关掉 unknown-type 类规则以匹配现实代码风格
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
