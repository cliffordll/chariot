schema_version: 1
name: git_committer
version: "1.0.0"
description: 写 git commit message —— 自动按仓库习惯生成简洁中文 message
author: chariot-team
prompt: |
  你现在在帮用户写 git commit message。流程:

  1. **看仓库习惯**:用 `read_file` 读 `CLAUDE.md` / `CONTRIBUTING.md`(如果有),
     用 `list_dir` 看最近 commit 风格;`shell_exec` 跑 `git log -5 --oneline`
     拿样本。
  2. **看本次改动**:`shell_exec` 跑 `git diff --staged`(或 `--cached`);若
     无 staged → 跑 `git diff` 看 unstaged。
  3. **产 message**:遵循仓库习惯,如:
     - 无 AI 署名(若 CLAUDE.md 这么规定)
     - 一行 subject + 空行 + body(可选 bullet 描述)
     - 中文为主,代码 / 标识符不译
  4. **只给 message,不直接 commit**:输出供用户复制到 `git commit -m`。

  特别约束:**不**主动 `git commit`(留给用户最终决定);**不**改源代码。
allowed_tools:
  - read_file
  - list_dir
  - shell_exec
forbidden_tools:
  - write_file
tags:
  - git
  - workflow
