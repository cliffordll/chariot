line-length = 120
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    # 项目对话、注释、文档全部中文(见 CLAUDE.md),全角标点是合理用法
    "RUF001", # ambiguous unicode char in string
    "RUF002", # ambiguous unicode char in docstring
    "RUF003", # ambiguous unicode char in comment
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint.per-file-ignores]
# 测试文件:函数名约定宽松;长行(docstring/注释/参数化用例)不卡 100 列
"tests/**" = ["N802", "N803", "E501"]
# typer Annotated 命令的 `Annotated[list[str], typer.Option(...)] = []` 是
# typer 推荐的重复参数写法,跟"避免 mutable default"的 B006 含义不冲突
"chariot/cli/commands/**" = ["B006"]
